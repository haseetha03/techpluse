<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up | Tech Pulse</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <style>
    :root {
      --violet-dark: #bb56e3;
      --card-light: #f3e7ff;
      --highlight: #d3a3ff;
      --white: #ffffff;
      --shadow: rgba(0, 0, 0, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #8e24aa;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .bubbles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      bottom: -100px;
      border-radius: 50%;
      opacity: 0.15;
      animation: rise 15s infinite ease-in;
    }

    .bubble:nth-child(1) { left: 5%; width: 40px; height: 40px; background: #f3e7ff; animation-duration: 8s; }
    .bubble:nth-child(2) { left: 15%; width: 80px; height: 80px; background: #e4c9fa; animation-duration: 10s; }
    .bubble:nth-child(3) { left: 25%; width: 30px; height: 30px; background: #ffeaff; animation-duration: 7s; }
    .bubble:nth-child(4) { left: 40%; width: 100px; height: 100px; background: #dfbfff; animation-duration: 12s; }
    .bubble:nth-child(5) { left: 55%; width: 60px; height: 60px; background: #fad9ff; animation-duration: 9s; }
    .bubble:nth-child(6) { left: 70%; width: 50px; height: 50px; background: #f3e7ff; animation-duration: 8s; }
    .bubble:nth-child(7) { left: 80%; width: 90px; height: 90px; background: #f1ccff; animation-duration: 11s; }
    .bubble:nth-child(8) { left: 90%; width: 35px; height: 35px; background: #e8bfff; animation-duration: 10s; }
    .bubble:nth-child(9) { left: 30%; width: 75px; height: 75px; background: #fff0ff; animation-duration: 9s; }

    @keyframes rise {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0.3;
      }
      100% {
        transform: translateY(-120vh) scale(1.4);
        opacity: 0;
      }
    }

    .container {
      display: flex;
      background: var(--card-light);
      border-radius: 16px;
      box-shadow: 0 8px 24px var(--shadow);
      overflow: hidden;
      z-index: 1;
      max-width: 900px;
      width: 90%;
    }

    .signup-form {
      flex: 1;
      padding: 40px 35px;
    }

    .signup-form h2 {
      text-align: center;
      color: var(--violet-dark);
      margin-bottom: 30px;
      font-size: 28px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: var(--violet-dark);
      font-weight: 500;
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-group input:focus {
      box-shadow: 0 0 0 3px var(--highlight);
      border-color: var(--highlight);
    }

    .btn-signup {
      width: 100%;
      padding: 12px;
      background: #bb56e3;
      color: #FFF;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn-signup:hover {
      background: #c7adde;
    }

    .signup-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--violet-dark);
    }

    .signup-footer a {
      color: var(--violet-dark);
      text-decoration: underline;
    }

   
    .image-section {
      flex: 1;
      display: flex;
      align-items: center;
      border-bottom-left-radius: 50px;
      border-top-left-radius: 50px;
      justify-content: center;
      padding: 20px;
      background-color: #FFF;
    }

    .image-section img {
      max-width: 100%;
      max-height: 350px;
      object-fit: contain;
      /* border-radius: 12px; */
      /* box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); */
    }


    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        border-radius: 12px;
      }

      .image-section {
        display: none;
      }

      .signup-form {
        padding: 30px 25px;
      }
    }
  </style>
</head>
<body>

    <div class="bubbles">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
  </div>

    <div class="container">
        <div class="signup-form">
      <h2>Create Your Account</h2>
      <form>
        <div class="input-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your full name" required />
        </div>
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" required />
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Create a password" required />
        </div>
        <button type="submit" class="btn-signup">Sign Up</button>
      </form>
      <div class="signup-footer">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </div>

        <div class="image-section">
      <img src="https://i.pinimg.com/1200x/34/44/7d/34447dc6a5ba7ca2ccdacbbc1ffb34ff.jpg"/>
    </div>
  </div>

  <script>
    document.querySelector(".btn-signup").addEventListener("click", function(event){
      event.preventDefault();

      let name = document.querySelector("#name").value;
      let email = document.querySelector("#email").value;
      let password = document.querySelector("#password").value;

      if(name && email && password) {
        // Create a user object
        const userDetails = {
          name: name,
          email: email,
          password: password
        };

        // Save the user object to localStorage under the key "UserDetails"
        localStorage.setItem("UserDetails", JSON.stringify(userDetails));

        alert("Sign up successful! You can now log in.");
        // Redirect to the login page
        window.location.href = "login.html";
      } else {
        alert("Please enter all the details to sign up.");
      }
    });
  </script>

</body>
</html>
